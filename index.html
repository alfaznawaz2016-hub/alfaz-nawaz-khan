<!DOCTYPE html>
<html lang="en" data-theme="minimal">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Md. Alfaz Nawaz Khan Shrabon — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   TOKENS — Minimal (default)
============================================================ */
:root {
  --bg: #fafaf7; --bg-2: #ffffff; --surface: #ffffff;
  --surface-2: #f4f4ef; --border: #e7e7e0; --text: #0a0a0a;
  --text-dim: #6b6b66; --accent: #111111; --accent-2: #444444;
  --grad: linear-gradient(135deg,#111 0%,#444 100%);
  --shadow: 0 8px 30px rgba(0,0,0,.06); --radius: 12px;
  --font-body: 'Inter',system-ui,sans-serif;
  --font-mono: 'JetBrains Mono',monospace;
  --font-display: 'Inter',sans-serif;
  --chip-bg: #f0f0ea; --section-rule: #e7e7e0;
  --t-bg: #1a1a2e; --t-bg-light: #16213e; --t-accent: #7c3aed;
  --t-accent-glow: rgba(124,58,237,.5); --t-text-main: #f8fafc; --t-text-muted: #94a3b8;
  --card-bg: #0f0f17; --card-accent: #66e0ff; --card-accent2: #9e30a9;
  --pip-green: #1aff40; --pip-glow: rgba(26,255,64,.6); --pip-bg: #020a02;
  --glow-color: #111; --glow-spread: rgba(17,17,17,.15); --glow-btn-bg: #111;
  --nav-bg: rgba(250,250,247,.85);
}

/* ============================================================
   TOKENS — Data Science Mode
============================================================ */
[data-theme="data-science"] {
  --bg: #020a02; --bg-2: #060614; --surface: rgba(10,14,24,.7);
  --surface-2: rgba(20,24,40,.8); --border: rgba(102,224,255,.25);
  --text: #e6f7ff; --text-dim: #7c8aa0; --accent: #66e0ff;
  --accent-2: #9e30a9; --grad: linear-gradient(135deg,#66e0ff 0%,#e366ff 100%);
  --shadow: 0 0 40px rgba(102,224,255,.2); --radius: 0;
  --font-body: 'Space Grotesk',sans-serif;
  --font-mono: 'JetBrains Mono','Courier New',monospace;
  --font-display: 'Space Grotesk',sans-serif;
  --chip-bg: rgba(102,224,255,.08); --section-rule: rgba(102,224,255,.2);
  --t-bg: #1e1e24; --t-bg-light: #2b2b36; --t-accent: #7c3aed;
  --t-accent-glow: rgba(124,58,237,.5); --t-text-main: #f8fafc; --t-text-muted: #94a3b8;
  --card-bg: hsl(296,59%,10%); --card-accent: #66e0ff; --card-accent2: #9e30a9;
  --pip-green: #1aff40; --pip-glow: rgba(26,255,64,.6); --pip-bg: #020a02;
  --glow-color: #66e0ff; --glow-spread: rgba(102,224,255,.5);
  --glow-btn-bg: transparent; --nav-bg: rgba(2,10,2,.85);
}

/* ============================================================
   RESET & BASE
============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;min-height:100vh;transition:background .4s ease,color .4s ease}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--bg)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* DS ambient layers */
.ds-bg,.ds-grid,.ds-scanlines,.ds-glitch{display:none}
[data-theme="data-science"] .ds-bg,[data-theme="data-science"] .ds-grid,[data-theme="data-science"] .ds-scanlines,[data-theme="data-science"] .ds-glitch{display:block}
.ds-bg{position:fixed;inset:0;z-index:-3;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(102,224,255,.08),transparent 60%),radial-gradient(ellipse 60% 50% at 80% 30%,rgba(158,48,169,.10),transparent 60%),radial-gradient(ellipse 50% 40% at 50% 100%,rgba(26,255,64,.06),transparent 60%),var(--bg)}
.ds-grid{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(102,224,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(102,224,255,.08) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);animation:gridScroll 30s linear infinite}
@keyframes gridScroll{from{background-position:0 0}to{background-position:0 60px}}
.ds-scanlines{position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0%,rgba(102,224,255,.015) 1px,transparent 2px,transparent 3px);animation:scanShift 8s linear infinite}
@keyframes scanShift{from{background-position-y:0}to{background-position-y:100px}}
.ds-glitch{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(transparent 50%,rgba(0,0,0,.02) 50%);background-size:100%4px}

/* ============================================================
   LAYOUT
============================================================ */
.container{max-width:1200px;margin:0 auto;padding:0 24px}
section{padding:100px 0;position:relative}
[data-theme="data-science"] section{padding:80px 0}

/* ============================================================
   THEME SWITCHER
============================================================ */
.theme-switch{position:fixed;top:90px;right:24px;z-index:200;display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:100px;backdrop-filter:blur(20px);box-shadow:var(--shadow)}
.theme-btn{padding:8px 16px;border:none;background:transparent;font-family:var(--font-body);font-size:.78rem;font-weight:600;color:var(--text-dim);border-radius:100px;cursor:pointer;transition:all .3s ease;letter-spacing:.05em}
.theme-btn.active{background:var(--text);color:var(--bg)}
[data-theme="data-science"] .theme-btn.active{background:var(--accent);color:#020a02;box-shadow:0 0 15px var(--accent)}

/* ============================================================
   NAV
============================================================ */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:18px 0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:var(--nav-bg);border-bottom:1px solid var(--border);transition:all .3s ease}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:1.2rem;letter-spacing:-.02em;color:var(--text);text-decoration:none;transition:color .3s}
[data-theme="data-science"] .logo{font-family:var(--font-mono);letter-spacing:.1em}
[data-theme="data-science"] .logo::before{content:'> ';color:var(--pip-green)}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{color:var(--text-dim);text-decoration:none;font-size:.92rem;font-weight:500;transition:color .3s;position:relative}
.nav-links a:hover{color:var(--text)}
.nav-links a::after{content:'';position:absolute;bottom:-6px;left:0;width:0;height:1px;background:var(--text);transition:width .3s}
[data-theme="data-science"] .nav-links a::after{background:var(--accent);height:2px;box-shadow:0 0 8px var(--accent)}
.nav-links a:hover::after{width:100%}
.nav-cta{padding:10px 22px;border-radius:100px;font-size:.88rem;font-weight:600;background:var(--grad);color:#fff;text-decoration:none;transition:all .3s;display:inline-block}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.15)}
[data-theme="data-science"] .nav-cta{display:none}
.menu-btn{display:none;background:none;border:none;color:var(--text);cursor:pointer;font-size:1.5rem}

/* ============================================================
   BUTTONS
============================================================ */
.btn{padding:14px 28px;border-radius:100px;font-weight:600;font-size:.95rem;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .3s;cursor:pointer;border:none;font-family:inherit}
.btn-primary{background:var(--grad);color:#fff}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,0,0,.15)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-2);transform:translateY(-3px)}
/* DS glow button */
[data-theme="data-science"] .glowbutton{--glow-color:var(--accent);--glow-spread-color:rgba(102,224,255,.5);border:.12em solid var(--glow-color);padding:.8em 2em;color:var(--glow-color);font-size:.82rem;font-weight:700;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.15em;background-color:var(--glow-btn-bg);border-radius:.4em;outline:none;box-shadow:0 0 1em .12em var(--glow-color),0 0 3em .4em var(--glow-spread-color),inset 0 0 .5em .1em var(--glow-color);text-shadow:0 0 .5em var(--glow-color);position:relative;transition:all .3s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
[data-theme="data-science"] .glowbutton::after{pointer-events:none;content:"";position:absolute;top:120%;left:0;height:100%;width:100%;background-color:var(--glow-spread-color);filter:blur(1.5em);opacity:.6;transform:perspective(1.5em) rotateX(35deg) scale(1,.6);z-index:-1}
[data-theme="data-science"] .glowbutton:hover{color:#020a02;background-color:var(--glow-color);box-shadow:0 0 1em .12em var(--glow-color),0 0 5em 1.5em var(--glow-spread-color),inset 0 0 .5em .1em var(--glow-color)}
[data-theme="data-science"] .glowbutton:active{box-shadow:0 0 .6em .12em var(--glow-color),0 0 2.5em 1em var(--glow-spread-color),inset 0 0 .4em .1em var(--glow-color)}

/* Minimal ghost button overrides */
[data-theme="minimal"] .btn-ghost{border-radius:100px;padding:14px 28px}

/* ============================================================
   HERO
============================================================ */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:100px}
.hero-inner{display:grid;grid-template-columns:1.2fr .8fr;gap:60px;align-items:center}
.hero-eyebrow{display:inline-block;font-size:.82rem;color:var(--text-dim);font-family:var(--font-mono);margin-bottom:24px;letter-spacing:.05em}
[data-theme="data-science"] .hero-eyebrow{color:var(--pip-green);text-transform:uppercase;letter-spacing:.2em}
[data-theme="data-science"] .hero-eyebrow::before{content:'[ ';color:var(--text-dim)}
[data-theme="data-science"] .hero-eyebrow::after{content:' ]';color:var(--text-dim)}
[data-theme="data-science"] .hero-eyebrow .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pip-green);box-shadow:0 0 10px var(--pip-green);animation:pulse 1.5s infinite;margin-right:8px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:clamp(2.4rem,5.5vw,4.2rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;margin-bottom:20px}
[data-theme="data-science"] .hero h1{font-family:var(--font-display);letter-spacing:-.02em;text-shadow:0 0 30px rgba(102,224,255,.3)}
[data-theme="data-science"] .hero h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(102,224,255,.5))}
.hero h1 .typed{color:var(--accent)}
[data-theme="data-science"] .hero h1 .typed{color:var(--pip-green);text-shadow:0 0 15px var(--pip-green)}
[data-theme="data-science"] .hero h1 .typed::after{content:'_';animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.hero p.lead{font-size:1.1rem;color:var(--text-dim);max-width:540px;margin-bottom:32px}
[data-theme="data-science"] .hero p.lead{font-family:var(--font-mono);font-size:.95rem}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:48px}
[data-theme="data-science"] .hero-cta{gap:20px}
.hero-stats{display:flex;gap:32px}
.stat-num{font-size:2rem;font-weight:800;color:var(--text)}
[data-theme="data-science"] .stat-num{color:var(--accent);font-family:var(--font-mono);text-shadow:0 0 15px var(--accent)}
.stat-label{font-size:.82rem;color:var(--text-dim)}
[data-theme="data-science"] .stat-label{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em}

/* Hero visual */
.hero-visual{position:relative;aspect-ratio:1/1;max-width:420px;margin-left:auto}
[data-theme="data-science"] .hero-visual{max-width:360px}
.hero-card{position:absolute;inset:0;border-radius:24px;background:var(--surface);border:1px solid var(--border);padding:28px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
[data-theme="data-science"] .hero-card{background:rgba(2,10,18,.8);border:1px solid var(--accent);border-radius:0;clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));box-shadow:0 0 30px rgba(102,224,255,.4),inset 0 0 30px rgba(102,224,255,.05);position:relative}
[data-theme="data-science"] .hero-card::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0%,rgba(102,224,255,.03) 1px,transparent 2px);pointer-events:none}
[data-theme="data-science"] .hero-card::after{content:'// SYSTEM_READY';position:absolute;bottom:12px;left:16px;font-family:var(--font-mono);font-size:.7rem;color:var(--pip-green);letter-spacing:.1em}
.hero-card .avatar{width:100%;aspect-ratio:1/1;border-radius:20px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:8rem;font-weight:800;color:#fff;position:relative;overflow:hidden}
[data-theme="data-science"] .hero-card .avatar{border-radius:0;clip-path:polygon(15% 0,100% 0,100% 85%,85% 100%,0 100%,0 15%);background:linear-gradient(135deg,rgba(102,224,255,.2),rgba(158,48,169,.2));border:1px solid var(--accent);font-family:var(--font-display);text-shadow:0 0 30px var(--accent)}
[data-theme="data-science"] .hero-card .avatar::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(102,224,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(102,224,255,.15) 1px,transparent 1px);background-size:20px 20px}
.hero-card .meta{text-align:center;margin-top:16px}
.hero-card .meta strong{display:block;font-size:1.05rem}
.hero-card .meta span{color:var(--text-dim);font-size:.85rem}
[data-theme="data-science"] .hero-card .meta strong{font-family:var(--font-mono);color:var(--accent);letter-spacing:.05em}
.floating-chip{position:absolute;padding:10px 16px;border-radius:100px;background:var(--bg);border:1px solid var(--border);font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:8px;animation:float 6s ease-in-out infinite;box-shadow:var(--shadow)}
[data-theme="data-science"] .floating-chip{font-family:var(--font-mono);border-radius:0;border-color:var(--accent);color:var(--accent);text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;background:rgba(2,10,2,.9);box-shadow:0 0 15px rgba(102,224,255,.3);clip-path:polygon(0 0,100% 0,100% 70%,90% 100%,0 100%)}
.chip-1{top:10%;left:-10%;animation-delay:0s}
.chip-2{top:50%;right:-15%;animation-delay:-2s}
.chip-3{bottom:8%;left:5%;animation-delay:-4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ============================================================
   SECTION HEADER
============================================================ */
.section-head{text-align:center;margin-bottom:60px}
.section-eyebrow{display:inline-block;font-size:.85rem;color:var(--text-dim);font-family:var(--font-mono);margin-bottom:12px;letter-spacing:.1em}
[data-theme="data-science"] .section-eyebrow{color:var(--pip-green);text-transform:uppercase}
[data-theme="data-science"] .section-eyebrow::before{content:'// ';color:var(--text-dim)}
.section-title{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:14px}
[data-theme="data-science"] .section-title{font-family:var(--font-display)}
[data-theme="data-science"] .section-title .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.section-sub{color:var(--text-dim);max-width:600px;margin:0 auto}
[data-theme="data-science"] .section-sub{font-family:var(--font-mono);font-size:.9rem}

/* ============================================================
   ABOUT (Minimal: island cards | DS: terminal panel)
============================================================ */
.islands{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.island{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;transition:transform .4s ease,border-color .4s ease,background .4s ease;opacity:0;transform:translateY(40px)}
.island.in-view{opacity:1;transform:translateY(0)}
.island:hover{transform:translateY(-4px)}
[data-theme="data-science"] .island{background:rgba(2,10,18,.6);border:1px solid var(--border);border-radius:0;position:relative;backdrop-filter:blur(8px)}
[data-theme="data-science"] .island::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6}
[data-theme="data-science"] .island::after{content:'';position:absolute;top:0;left:0;width:1px;height:100%;background:linear-gradient(180deg,var(--accent),transparent);opacity:.4}
[data-theme="data-science"] .island:hover{border-color:var(--accent);box-shadow:0 0 30px rgba(102,224,255,.2);background:rgba(2,10,18,.85)}
.island-icon{width:48px;height:48px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:18px}
[data-theme="data-science"] .island-icon{border-radius:0;background:transparent;border:1px solid var(--accent);font-family:var(--font-mono);font-size:1.2rem;clip-path:polygon(0 0,100% 0,100% 70%,80% 100%,0 100%)}
.island h3{font-size:1.1rem;margin-bottom:8px;font-weight:700}
[data-theme="data-science"] .island h3{font-family:var(--font-mono);color:var(--accent);font-size:1rem;letter-spacing:.05em}
.island p{color:var(--text-dim);font-size:.92rem}
[data-theme="data-science"] .island p{font-size:.88rem;line-height:1.7;font-family:var(--font-mono)}
.span-4{grid-column:span 4}
.span-6{grid-column:span 6}
.span-8{grid-column:span 8}
.span-12{grid-column:span 12}

/* DS terminal about panel */
.about-panel{display:none}
[data-theme="data-science"] .about-panel{display:block}
[data-theme="data-science"] .islands{display:none}
.terminal-panel{background:var(--pip-bg);border:1px solid var(--pip-green);padding:24px;max-width:900px;margin:0 auto;font-family:var(--font-mono);color:var(--pip-green);font-size:.85rem;position:relative;overflow:hidden}
.terminal-panel::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0%,rgba(26,255,64,.03) 1px,transparent 2px);pointer-events:none}
.terminal-panel .t-line{margin-bottom:8px;display:flex;gap:12px}
.terminal-panel .t-prompt{color:var(--accent);flex-shrink:0}
.terminal-panel .t-cmd{color:var(--pip-green)}
.terminal-panel .t-out{color:var(--text-dim);padding-left:24px;border-left:2px solid rgba(26,255,64,.2);margin:4px 0 16px}
.terminal-panel .t-out strong{color:#fff}
.terminal-panel .t-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.terminal-panel .t-stat{border:1px solid var(--pip-green);padding:16px;text-align:center;background:rgba(26,255,64,.05)}
.terminal-panel .t-stat .n{font-size:2rem;font-weight:700;color:#fff;text-shadow:0 0 10px var(--pip-glow)}
.terminal-panel .t-stat .l{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}

/* ============================================================
   SKILLS
============================================================ */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.skill-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;transition:all .3s;opacity:0;transform:translateY(40px)}
.skill-card.in-view{opacity:1;transform:translateY(0)}
.skill-card:hover{transform:translateY(-4px)}
[data-theme="data-science"] .skill-card{border-radius:0;background:rgba(2,10,18,.6);border:1px solid var(--accent);position:relative;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
[data-theme="data-science"] .skill-card:hover{box-shadow:0 0 25px rgba(102,224,255,.3)}
.skill-card h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:16px;font-family:var(--font-mono)}
[data-theme="data-science"] .skill-card h4{color:var(--pip-green)}
.skill-tags{display:flex;flex-wrap:wrap;gap:8px}
.skill-tag{padding:6px 14px;border-radius:100px;font-size:.85rem;background:var(--chip-bg);color:var(--text);border:1px solid var(--border);transition:all .3s}
[data-theme="data-science"] .skill-tag{border-radius:0;font-family:var(--font-mono);font-size:.78rem;background:rgba(102,224,255,.08);border:1px solid var(--accent);color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
[data-theme="data-science"] .skill-tag:hover{background:var(--accent);color:#020a02;box-shadow:0 0 10px var(--accent)}

/* DS Pip-Boy */
.pipboy-wrapper{display:none}
[data-theme="data-science"] .pipboy-wrapper{display:block}
[data-theme="data-science"] .skills-grid{display:none}
.pipboy-wrapper{--pip-green:#1aff40;--pip-glow:rgba(26,255,64,.6);--pip-bg:#020a02;--chassis-dark:#1a1a1a;display:flex;justify-content:center;align-items:center;font-family:"Courier New",monospace;text-transform:uppercase;width:100%;max-width:800px;margin:0 auto;padding:1rem;box-sizing:border-box;container-type:inline-size;container-name:pipboy}
.pipboy-chassis{background:var(--chassis-dark);border-radius:20px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.8),inset 0 2px 4px rgba(255,255,255,.05);border:2px solid #0a0a0a;width:100%;position:relative}
.pipboy-chassis::before,.pipboy-chassis::after{content:'';position:absolute;width:8px;height:8px;background:#444;border-radius:50%;box-shadow:inset 0 0 2px #000}
.pipboy-chassis::before{top:6px;left:6px;box-shadow:6px 0 0 #444,0 6px 0 #444,6px 6px 0 #444}
.pipboy-chassis::after{top:6px;right:6px;box-shadow:-6px 0 0 #444,0 6px 0 #444,-6px 6px 0 #444}
.crt-screen{background:var(--pip-bg);border-radius:8px;padding:24px;color:var(--pip-green);position:relative;overflow:hidden;border:2px solid #0a0a0a;min-height:480px}
.scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.15) 1px,transparent 1px,transparent 3px);z-index:10}
.screen-glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,transparent 50%);z-index:11}
.crt-content{position:relative;z-index:5}
.dynamic-title::before{content:'SYS_STATUS'}
.crt-content input[type="radio"]{display:none}
.tab-labels{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--pip-green);padding-bottom:8px}
.tab-labels label{padding:6px 14px;cursor:pointer;font-size:.85rem;border:1px solid transparent;transition:all .2s}
.tab-labels label:hover{background:rgba(26,255,64,.1)}
#tab-stat:checked~.tab-labels label[for="tab-stat"],#tab-inv:checked~.tab-labels label[for="tab-inv"],#tab-data:checked~.tab-labels label[for="tab-data"]{background:rgba(26,255,64,.2);border-color:var(--pip-green);box-shadow:0 0 8px var(--pip-glow)}
.content-stat,.content-inv,.content-data{display:none}
#tab-stat:checked~.content-stat{display:grid;grid-template-columns:1fr 1fr;gap:20px}
#tab-inv:checked~.content-inv{display:block}
#tab-data:checked~.content-data{display:block}
.side-menu{list-style:none;font-size:.85rem}
.side-menu li{padding:10px 0;border-bottom:1px dashed rgba(26,255,64,.2);display:flex;justify-content:space-between}
.side-menu li .val{color:#fff}
.terminal-block{background:rgba(0,0,0,.4);border:1px solid var(--pip-green);padding:14px;font-size:.78rem;line-height:1.6}
.terminal-block .time{font-size:1.6rem;color:#fff;text-shadow:0 0 10px var(--pip-green)}
.terminal-block .date{font-size:.72rem;color:var(--text-dim);margin-top:4px}
.inventory-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.inventory-list li{list-style:none;padding:8px 12px;background:rgba(26,255,64,.08);border-left:2px solid var(--pip-green);font-size:.82rem;transition:background .2s}
.inventory-list li:hover{background:rgba(26,255,64,.2)}
.hazard-symbol{width:140px;height:140px;margin:20px auto;position:relative;background:conic-gradient(from 0deg,var(--pip-green) 0deg 60deg,transparent 60deg 120deg,var(--pip-green) 120deg 180deg,transparent 180deg 240deg,var(--pip-green) 240deg 300deg,transparent 300deg 360deg);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:radarSpin 4s linear infinite;filter:drop-shadow(0 0 10px var(--pip-glow))}
@keyframes radarSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.radar-sweep{position:absolute;top:50%;left:50%;width:140px;height:2px;background:linear-gradient(90deg,var(--pip-green),transparent);transform-origin:left center;animation:radarSpin 4s linear infinite;filter:drop-shadow(0 0 8px var(--pip-glow))}
.radar-center{position:absolute;top:calc(50% - 4px);left:calc(50% - 4px);width:8px;height:8px;background:var(--pip-green);border-radius:50%;box-shadow:0 0 10px var(--pip-glow)}
.radio-visualizer{display:flex;gap:3px;align-items:flex-end;height:60px;margin-top:20px}
.radio-visualizer span{flex:1;background:var(--pip-green);height:20%;box-shadow:0 0 6px var(--pip-glow);animation:eq 1.2s ease-in-out infinite}
@keyframes eq{0%,100%{height:20%}50%{height:90%}}
.radio-visualizer span:nth-child(1){animation-delay:0s}
.radio-visualizer span:nth-child(2){animation-delay:.1s}
.radio-visualizer span:nth-child(3){animation-delay:.2s}
.radio-visualizer span:nth-child(4){animation-delay:.3s}
.radio-visualizer span:nth-child(5){animation-delay:.4s}
.radio-visualizer span:nth-child(6){animation-delay:.5s}
.radio-visualizer span:nth-child(7){animation-delay:.6s}
